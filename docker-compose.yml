# Бот, PostgreSQL, Redis (состояния диалогов) и ежедневная копия БД в ./backups. Запуск: docker compose up -d --build; логи: docker compose logs -f bot
# В .env, кроме ключей бота, нужен POSTGRES_PASSWORD (пароль БД в контейнере);
# POSTGRES_USER и POSTGRES_DB необязательны (по умолчанию coach и coach_db).
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-coach}
      POSTGRES_DB: ${POSTGRES_DB:-coach_db}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Порт наружу не публикуется: БД нужна только боту внутри сети compose

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # AOF: состояния диалогов переживают и перезапуск самого Redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Порт наружу не публикуется, как и у БД

  backup:
    image: postgres:16          # pg_dump той же версии, что сервер
    restart: unless-stopped
    entrypoint: ["sh", "/scripts/backup.sh"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-coach}
      POSTGRES_DB: ${POSTGRES_DB:-coach_db}
      PGPASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
      TZ: ${BACKUP_TZ:-Europe/Moscow}     # только имя IANA: «UTC+05:00» Linux поймёт как UTC−5
      BACKUP_HOUR: ${BACKUP_HOUR:-4}
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
    volumes:
      - ./scripts/backup.sh:/scripts/backup.sh:ro
      # Папка на хосте, а не том Docker: копии переживают docker compose down -v
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy

  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # Перекрывают значения из .env: внутри compose БД доступна по имени сервиса db
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-coach}:${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}@db:5432/${POSTGRES_DB:-coach_db}
      GARMIN_TOKENS_DIR: /app/.garmin_tokens
      REDIS_URL: redis://redis:6379/0
      BACKUP_DIR: /backups
      # Шлюз OmniRoute (LLM_PROVIDER=omniroute) работает на хосте: localhost контейнера это сам контейнер
      OMNIROUTE_BASE_URL: http://host.docker.internal:20128/v1
    # Docker Desktop знает это имя сам, на Linux его нужно добавить (адрес моста docker0)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - garmin_tokens:/app/.garmin_tokens
      # Только чтение: бот проверяет, что копирование не остановилось (services/backup_watch.py)
      - ./backups:/backups:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  garmin_tokens:
